[workspace]
members = [
    "app-bevy",
    "lib-utils",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
# Bevy's default features include 2D, 3D, UI, audio, Wayland and X11.
bevy = "0.20"

# Keep game code quick to rebuild and optimize Bevy and its dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Spend more time optimizing the final game binary.
[profile.release]
codegen-units = 1
lto = "thin"

# With the wasm32-unknown-unknown target installed, use
# `cargo build --target wasm32-unknown-unknown --profile wasm-release`.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
