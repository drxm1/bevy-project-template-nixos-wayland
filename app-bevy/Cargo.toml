[package]
name = "app-bevy"
version = { workspace = true }
edition = { workspace = true }

[dependencies]
bevy = { workspace = true }
log = { workspace = true }
lib-utils = { path = "../lib-utils" }

[features]
default = []
# Opt-in fast dev iteration: compile Bevy as a shared library so only your own code
# relinks between runs. Enabled by `cargo dev` (alias in .cargo/config.toml).
# Keep it OUT of release builds — a dynamically linked binary needs libbevy_dylib at
# runtime and is incompatible with LTO.
dev = ["bevy/dynamic_linking"]
