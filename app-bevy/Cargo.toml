[package]
name = "app-bevy"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[dependencies]
bevy = { workspace = true }
lib-utils = { path = "../lib-utils" }
# Cap log output from dependencies such as wgpu in the final game.
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }

[features]
default = []
# `cargo dev` enables Bevy's debug names, developer tools and asset watcher,
# and links Bevy as a shared library for faster rebuilds.
dev = ["bevy/dev", "bevy/dynamic_linking"]
